<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        .con{
            height: 100vh;
            width: 100vw;
            text-align: center;
            
        }
        .BOX{
            height: 250px;
            width: 80%;
            margin-left: 150px;
            margin-bottom: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: bisque;
        }
        .box{
            border-radius: 10px;
            height: 100px;
            width: 100px;
            color: white;
            text-align: center;
            line-height: 90px;
            margin: 25px;
            /* border: 1px solid black; */
            animation-duration: 1.5s;
            animation-iteration-count: infinite;
        }
        .b1{
            background-color: crimson;
            animation-name: color;
        }
        @keyframes color{
            from{
                background-color: crimson;
            }
            to{
                background-color: rgb(173, 92, 250);
            }
        }
        .b2{
            background-color: rgb(241, 166, 5);
            animation-name: move;
        }
        @keyframes move{
            0%{
                transform: translate(0);
            }
            50%{
                transform: translate(0,50px);
            }
            100%{
                transform: translate(0);
            }
        }
        .b3{
            background-color: darkgreen;
            animation-name: rotate;
        }
        @keyframes rotate{
            0%{
                transform: rotate(0deg);
            }
            100%{
                transform: rotate(360deg);
            }
        }
        .b4{
            background-color: rgb(17, 235, 216);
            animation-name: pulse;
        }
        @keyframes pulse{
            0%{
                transform: scale(1);
            }
            50%{
                transform: scale(1.5);
            }
            100%{transform: scale(1);}
        }
        .b5{
            background-color: gray;
            animation-name: fade;
        }
        @keyframes fade{
            0%{
                opacity: 1;
            }
            50%{
                opacity: 0;
            }
            100%{
                opacity: 1;
            }
        }
        .b6{
            border: 10px solid lightgray;
            border-top: 10px solid blue;
            border-radius: 50%;
            animation-name: rotate;
        }
        .b7 {
            height: 80px;
            width: 80px;
            background-color: green;
            animation: walk-box 3s ease-in-out infinite;
        }

        @keyframes walk-box {
            0% { transform: translate(0px, 0px); }
            25% { transform: translate(220px, 0px); }
            50% { transform: translate(220px, 220px); }
            75% { transform: translate(0px, 220px); }
            100% { transform: translate(0px, 0px); }
        }

        .google {
            align-items: center;
            justify-content: center;
            display: flex;
            gap: 5px;
        }
        .dot {
            border-radius: 50%;
            height: 25px;
            width: 25px;
            animation: jiggle 0.5s cubic-bezier(1, 0.35, 0.65, 1) infinite;
        }

        @keyframes jiggle {
            0% { transform: translateY(0px);}
            25% { transform: translateY(-8px);}
            50% { transform: translateY(0px);}
            75% { transform: translateY(8px);}
            100% { transform: translateY(0px);}
        }
        .move-box{
            height: 200px;
            width: 200px;
            border: 2px dashed black;
            margin-left: 550px ;
        }
        .sq1{
            height: 50px;
            width: 50px;
            background-color: purple;
            animation-name: move-border;
            animation-duration: 5s;
            animation-iteration-count: infinite;
        }
        @keyframes move-border{
            0%{
                transform: translate(0px,0px);
            }
            25%{
                transform: translate(150px,0px);
            }
            50%{
                transform: translate(150px,150px);
            }
            75%{
                transform: translate(0px,150px);
            }
            100%{
                transform: translate(0px,0px);
            }
        }
        .boxg{
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="con">
        <h1>CSS Animations</h1>
        <div class="BOX">
            <div class="box b1">Color</div>
            <div class="box b2">Move</div>
            <div class="box b3">Rotate</div>
            <div class="box b4">Pulse</div>
            <div class="box b5">Fade</div>
            <div class="box b6">Spin</div>
        </div>
            
        <div class="con">
            <div class="move-box">
                <div class="sq1"></div>
            </div>
            <div class="boxg">
                <div class="google">
                    <div class="dot" style="background-color: red; animation-delay: 0.1s;"></div>
                    <div class="dot" style="background-color: yellow; animation-delay: 0.2s"></div>
                    <div class="dot" style="background-color: orange; animation-delay: 0.3s"></div>
                    <div class="dot" style="background-color: green; animation-delay: 0.4s"></div>
                    <div class="dot" style="background-color: blue; animation-delay: 0.5s"></div>
                </div>
            </div>
    
        </div>
            </div>
            
</body>
</html>
